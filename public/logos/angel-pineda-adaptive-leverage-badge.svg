<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive leverage logo badge</title>
  <desc id="desc">
    A dark rounded-square badge featuring the adaptive leverage mark for social icons, favicons, and
    compact brand uses.
  </desc>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(182 58) rotate(135) scale(122)">
      <stop offset="0" stop-color="#7fc3ff" stop-opacity=".28" />
      <stop offset=".65" stop-color="#7fc3ff" stop-opacity="0" />
    </radialGradient>
    <style>
      .ink {
        fill: none;
        stroke: #f7f8fb;
        stroke-linecap: round;
